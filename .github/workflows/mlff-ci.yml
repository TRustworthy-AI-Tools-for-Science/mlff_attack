name: MLFF CI

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "scripts/setup_*.sh"
      - ".github/workflows/mlff-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "scripts/setup_*.sh"
      - ".github/workflows/mlff-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlff-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-ubuntu-test:
    name: Native Ubuntu (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [mace, uma, chgnet, mtp]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run setup (${{ matrix.backend }})
        run: |
          echo "Running on native Ubuntu for ${{ matrix.backend }}"
          uname -a

          SETUP_SCRIPT="scripts/setup_${{ matrix.backend }}.sh"
          if [ ! -f "$SETUP_SCRIPT" ]; then
            echo "ERROR: Setup script $SETUP_SCRIPT not found."
            exit 1
          fi

          if grep -q "command -v conda" "$SETUP_SCRIPT"; then
            if ! command -v conda >/dev/null 2>&1; then
              if [ ! -x "$HOME/miniforge3/bin/conda" ]; then
                curl -L https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
                bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
              fi
              export PATH="$HOME/miniforge3/bin:$PATH"
            fi
          fi

          bash "$SETUP_SCRIPT"

      - name: Verify installed environment (${{ matrix.backend }})
        run: |
          case "${{ matrix.backend }}" in
            mace)
              .venv-mace/bin/python -c "import mlff_attack, mace"
              .venv-mace/bin/calc-single --help >/dev/null
              echo "MACE installation passed"
              ;;
            uma)
              .venv-uma/bin/python -c "import mlff_attack, fairchem.core"
              .venv-uma/bin/calc-single --help >/dev/null
              echo "UMA installation passed"
              ;;
            chgnet)
              .venv-chgnet/bin/python -c "import mlff_attack, chgnet"
              .venv-chgnet/bin/calc-single --help >/dev/null
              echo "CHGNet installation passed"
              ;;
            mtp)
              if [ -x "$HOME/miniforge3/bin/conda" ]; then
                export PATH="$HOME/miniforge3/bin:$PATH"
              fi
              source "$(conda info --base)/etc/profile.d/conda.sh"
              conda run --name env-mtp python -c "import mlff_attack"
              conda run --name env-mtp bash -lc "command -v mlp"
              echo "MTP installation passed"
              ;;
          esac

  wsl-ubuntu-test:
    name: Ubuntu through WSL (${{ matrix.backend }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [mace, uma, chgnet, mtp]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu in WSL
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: sudo curl ca-certificates

      - name: Run setup inside WSL (${{ matrix.backend }})
        shell: wsl-bash {0}
        run: |
          echo "Running inside Ubuntu through WSL for ${{ matrix.backend }}"
          uname -a

          SETUP_SCRIPT="scripts/setup_${{ matrix.backend }}.sh"
          if [ ! -f "$SETUP_SCRIPT" ]; then
            echo "ERROR: Setup script $SETUP_SCRIPT not found."
            exit 1
          fi

          if grep -q "command -v conda" "$SETUP_SCRIPT"; then
            if ! command -v conda >/dev/null 2>&1; then
              if [ ! -x "$HOME/miniforge3/bin/conda" ]; then
                curl -L https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -o /tmp/miniforge.sh
                bash /tmp/miniforge.sh -b -p "$HOME/miniforge3"
              fi
              export PATH="$HOME/miniforge3/bin:$PATH"
            fi
          fi

          bash "$SETUP_SCRIPT"

      - name: Verify installed environment (${{ matrix.backend }})
        shell: wsl-bash {0}
        run: |
          case "${{ matrix.backend }}" in
            mace)
              .venv-mace/bin/python -c "import mlff_attack, mace"
              .venv-mace/bin/calc-single --help >/dev/null
              echo "MACE installation passed"
              ;;
            uma)
              .venv-uma/bin/python -c "import mlff_attack, fairchem.core"
              .venv-uma/bin/calc-single --help >/dev/null
              echo "UMA installation passed"
              ;;
            chgnet)
              .venv-chgnet/bin/python -c "import mlff_attack, chgnet"
              .venv-chgnet/bin/calc-single --help >/dev/null
              echo "CHGNet installation passed"
              ;;
            mtp)
              if [ -x "$HOME/miniforge3/bin/conda" ]; then
                export PATH="$HOME/miniforge3/bin:$PATH"
              fi
              source "$(conda info --base)/etc/profile.d/conda.sh"
              conda run --name env-mtp python -c "import mlff_attack"
              conda run --name env-mtp bash -lc "command -v mlp"
              echo "MTP installation passed"
              ;;
          esac
